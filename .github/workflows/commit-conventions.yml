name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A pull request may cancel its own earlier run: the next one re-checks the
# whole range. A push may not — it is checked over the range it pushed, so
# cancelling it would leave those commits unchecked by anything. Give each push
# a group of its own instead.
concurrency:
  group: >-
    ci-${{ github.event.pull_request.number
      || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  # The hook's regression suite. It lives here and runs only here: repositories
  # that consume the hook get the hook, not its tests.
  tests:
    name: commit-msg suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run the suite
        run: tests/run.sh

  # The hook checks this repository's own messages, with the copy under review
  # rather than a released one — a change that stops enforcing a rule shows up
  # as a failure here first.
  commit-conventions:
    name: Conventional Commits
    runs-on: ubuntu-latest
    # Ordered after the suite so a broken hook is reported as a broken hook,
    # not as a branch that happens to pass.
    needs: tests
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Through the action, which is how every other repository reaches this
      # check. A malformed action.yml would otherwise only be discovered by
      # whoever bumped the pin in qoax-reusables.
      - name: Validate commit messages and pull request title
        uses: ./
