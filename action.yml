name: Check commit conventions
description: >-
  Compares the caller's tracked copy of the commit-msg hook with this
  release's hook, then runs the hook over the commits a pull request or push
  added, and over a pull request's title.
author: Qoax Community

# The action lives at the repository root so github.action_path is the checkout
# itself: the hook and the scripts sit right beside this file.
#
# The check is an action, not an `actions/checkout` of this repository. Thus a
# caller needs one step and no knowledge of the layout. The sha pin of that
# step also names the one hook release that the caller's copy must equal. When
# Dependabot moves the pin, the compare shows whether the copy must change too.
#
# The caller must have checked itself out with fetch-depth: 0, or there is no
# range to enumerate.

inputs:
  range:
    description: >-
      A revision range to check, e.g. main..HEAD. Leave unset in CI: the range
      is derived from the event instead.
    required: false
    default: ''
  check-pull-request-title:
    description: >-
      Whether to check the pull request title as well. With squash merging it
      becomes the commit subject on the default branch, so it is held to the
      same rules.
    required: false
    default: 'true'
  copy:
    description: >-
      The path of the tracked copy of the commit-msg hook, from the repository
      root. The check compares the copy in the tree of HEAD with the hook of
      this action. An empty string turns the compare off. That is the only
      opt-out, for a repository with no copy.
    required: false
    default: .githooks/commit-msg
  stale-copy:
    description: >-
      The level for a copy that is an older release of the hook: error or
      warning. Every other mismatch is an error, because only a commit can
      cause it.
    required: false
    default: error

runs:
  using: composite
  steps:
    # One step runs both scripts, so a failed compare does not hide the
    # message results, and no step needs if: always().
    - name: Check the hook copy, the commit messages and the pull request title
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
        # Passed through the environment rather than interpolated into the
        # script, so a title can never be read as shell.
        PR_TITLE: >-
          ${{ inputs.check-pull-request-title == 'true'
              && github.event.pull_request.title || '' }}
        # Dependabot's title gets the waivers its commits do.
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        RANGE: ${{ inputs.range }}
        # Through the environment for the same reason as the title.
        COPY: ${{ inputs.copy }}
        STALE_COPY: ${{ inputs.stale-copy }}
      run: |
        set -uo pipefail
        status=0
        # check-copy.sh gives its defaults to unset variables only. An empty
        # input must stay empty, because an empty copy turns the compare off.
        COPY="${COPY-}" STALE_COPY="${STALE_COPY-}" \
          "${{ github.action_path }}/scripts/check-copy.sh" || status=1
        # shellcheck disable=SC2086
        "${{ github.action_path }}/scripts/check-messages.sh" $RANGE || status=1
        exit "$status"
